name: Release ZIP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create plugin ZIP
        run: |
          mkdir urlQrCode
          cp main.js qrcode-lib.js plugin.json thumbnail.svg LICENSE urlQrCode/
          zip -r urlQrCode.zip urlQrCode/

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: urlQrCode.zip
