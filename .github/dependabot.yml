# Keeps the SHA-pinned actions current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Only propose releases that are at least a week old: hijacked packages
    # are usually caught and pulled within days, so the delay keeps them out.
    # Security updates ignore the cooldown and still arrive immediately.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
